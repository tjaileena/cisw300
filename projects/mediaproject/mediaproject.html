<!DOCTYPE html>
    
<html lang="en">
    
    
<head>
    <meta charset="UTF-8"> 
    <title>Media Project Jaileena Thao</title>
    
    <style>
    
        body {
            background-color: snow;
            font-family: Arial, sans-serif;
            color: black;
            margin: 0;
        }
        
        header {
            text-align: center;
            padding: 30px;
            background-color: linen;
            background-image: url(mediaprojectheader.jpg);
            background-repeat: repeat;
            background-position: center;
        }
        
        h1 {
            color: #8B735D;
        }
        
        h2 {
            color: #B58B72;
            text-align: center;
        }
        
        section {
            
            background-color: #FBE8E8;
            padding: 25px;
            margin: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        main {
            width: 80%;
            margin: auto;
            padding: 20px;
        }
        
        video {
            width: 80%;
            max-width: 650px;
            display: block;
            margin: 20px auto;
            border-radius: 12px;
        }
        
        audio {
            width: 80%;
            max-width: 400px;
        }
        
    </style>
</head>
    
<body>

    <header>
        <h1>My Media Page</h1>
        <p>Welcome to my media project! 𝜗ৎ</p>
    </header>
    
    <main>
        <section>
            <h2>BTS LA Day 1 Vlog ❤︎</h2>
            <p>Come to the BTS concert with me!</p>
            
            <video controls poster="btsday1pic.png">
                <source src="btsladay1.mp4" type="video/mp4" />
                <p><em>To play this video clip, your browser needs to support HTML 5.</em></p>
            </video> 
        </section>
        
        <section>
            <h2>My Favorite Song</h2>
            
            <p>Into the Sun by BTS ❤︎</p>
            
            <audio controls>
                <source src="intothesun.mp3" type="audio/mpeg" />
                <p><em>To play this audio clip, your browser needs to support HTML 5.</em></p>
            </audio>
            
        </section>
    </main>
    
</body>
</html>
